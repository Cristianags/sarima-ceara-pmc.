requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "scipy>=1.12,<2",
  "statsmodels>=0.14.4,<0.15",
  "statsforecast>=2.0,<3",
  "jupyter>=1.1,<2",
  "ipykernel>=6.29,<8",
  "tabulate>=0.9,<1",
]
